<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Userscript Auto Healer — Development</title>
</head>
<body>
  <main>
    <h1>Userscript Auto Healer</h1>
    <p>当前为只读导入开发版：不会执行、修改或安装脚本，自动修复与 Chrome 连接尚未开放。</p>
    <section id="drop-area" aria-label="油猴脚本导入区">
      <button id="choose-files" type="button">选择 .user.js 文件（多选）</button>
      <button id="choose-folder" type="button">选择脚本文件夹</button>
      <label for="select-files">也可选择或拖放 .user.js 文件：</label>
      <input id="select-files" type="file" multiple accept=".user.js">
      <ul id="import-list" aria-live="polite"></ul>
    </section>
    <p id="status" role="status">正在检查本地应用边界…</p>
  </main>
  <script src="./index.js"></script>
</body>
</html>
