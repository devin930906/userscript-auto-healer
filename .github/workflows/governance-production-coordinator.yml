name: 'Governance Production V2 Coordinator (Issue 565)'

on:
  pull_request:
    paths:
      - '.github/scripts/issue-round-coordinator-v2.py'
      - '.github/workflows/governance-production-coordinator.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Owner-authorized #565 operation (no product Issue transfers)'
        required: true
        type: choice
        options: [inspect, init, recover, acquire]
      proof_hash:
        description: 'For acquire only: SHA-256 owner proof digest, NOT the secret'
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  test:
    name: Validate owner-bound V2 transitions (NO REMOTE WRITE)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: |
          python3 -m py_compile .github/scripts/issue-round-coordinator-v2.py
          python3 .github/scripts/issue-round-coordinator-v2.py --self-test

  owner-operation:
    name: Owner-authenticated issue 565 transition (NO PRODUCT REF WRITE)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'devin930906'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Execute owner-gated single-Issue Git CAS
        env:
          GH_TOKEN: ${{ github.token }}
          OP: ${{ inputs.operation }}
          PROOF_HASH: ${{ inputs.proof_hash }}
        run: |
          set -euo pipefail
          case "$OP" in
            inspect|init|recover)
              [[ -z "$PROOF_HASH" ]] || { echo "::error::Unexpected proof hash"; exit 1; }
              python3 .github/scripts/issue-round-coordinator-v2.py --operation "$OP"
              ;;
            acquire)
              [[ "$PROOF_HASH" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Malformed digest"; exit 1; }
              python3 .github/scripts/issue-round-coordinator-v2.py --operation acquire --proof-hash "$PROOF_HASH"
              ;;
            *)
              echo '::error::Unsupported operation'; exit 1
              ;;
          esac
