name: 'Governance Production V2 Coordinator (Issue 565)'

on:
  pull_request:
    paths:
      - '.github/scripts/issue-round-coordinator-v2.py'
      - '.github/workflows/governance-production-coordinator.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Owner-authorized #565 operation (no product Issue transfers)'
        required: true
        type: choice
        options: [inspect, init, recover, acquire, release]
      proof_hash:
        description: 'For acquire only: SHA-256 owner proof digest, NOT the secret'
        required: false
        type: string
        default: ''
      public_key_hex:
        description: 'For acquire: public Ed25519 key (64 hex chars, NOT private key)'
        required: false
        type: string
        default: ''
      signature_hex:
        description: 'For release: one-use Ed25519 signature over round and expected head'
        required: false
        type: string
        default: ''
      expected_coord_sha:
        description: 'For release: signed current coordination head (40 hex chars)'
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  test:
    name: Validate owner-bound V2 transitions (NO REMOTE WRITE)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: |
          python3 -m py_compile .github/scripts/issue-round-coordinator-v2.py
          python3 .github/scripts/issue-round-coordinator-v2.py --self-test

  owner-operation:
    name: Owner-authenticated issue 565 transition (NO PRODUCT REF WRITE)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'devin930906'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Execute owner-gated single-Issue Git CAS
        env:
          GH_TOKEN: ${{ github.token }}
          OP: ${{ inputs.operation }}
          PROOF_HASH: ${{ inputs.proof_hash }}
          PUBLIC_KEY_HEX: ${{ inputs.public_key_hex }}
          SIGNATURE_HEX: ${{ inputs.signature_hex }}
          EXPECTED_COORD_SHA: ${{ inputs.expected_coord_sha }}
        run: |
          set -euo pipefail
          case "$OP" in
            inspect|init|recover)
              [[ -z "$PROOF_HASH" && -z "$PUBLIC_KEY_HEX" && -z "$SIGNATURE_HEX" && -z "$EXPECTED_COORD_SHA" ]] || { echo "::error::Unexpected owner-proof input"; exit 1; }
              python3 .github/scripts/issue-round-coordinator-v2.py --operation "$OP"
              ;;
            acquire)
              [[ "$PROOF_HASH" =~ ^[0-9a-f]{64}$ && "$PUBLIC_KEY_HEX" =~ ^[0-9a-f]{64}$ && -z "$SIGNATURE_HEX" && -z "$EXPECTED_COORD_SHA" ]] || { echo "::error::Invalid acquire public-key inputs"; exit 1; }
              python3 .github/scripts/issue-round-coordinator-v2.py --operation acquire --proof-hash "$PROOF_HASH" --public-key-hex "$PUBLIC_KEY_HEX"
              ;;
            release)
              [[ -z "$PROOF_HASH" && -z "$PUBLIC_KEY_HEX" && "$SIGNATURE_HEX" =~ ^[0-9a-f]{128}$ && "$EXPECTED_COORD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid signed release inputs"; exit 1; }
              python3 .github/scripts/issue-round-coordinator-v2.py --operation release --signature-hex "$SIGNATURE_HEX" --expected-coord-sha "$EXPECTED_COORD_SHA"
              ;;
            *)
              echo '::error::Unsupported operation'; exit 1
              ;;
          esac
