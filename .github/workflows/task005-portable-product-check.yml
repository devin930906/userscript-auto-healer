name: TASK-005 Portable Chrome Product Validation

on:
  pull_request:
    paths:
      - 'src/browser/**'
      - 'tests/browser/**'
      - 'package.json'
      - '.github/workflows/task005-portable-product-check.yml'
  workflow_dispatch:
    inputs:
      chrome_cpu_pressure:
        description: 'Manual diagnostic only: two test-owned CPU workers for at most eight seconds during Chrome startup'
        type: boolean
        required: false
        default: false
      chrome_boot_log:
        description: 'Manual Windows CI only: write Chrome startup log inside disposable runner profile (never upload raw log)'
        type: boolean
        required: false
        default: false
      chrome_full_suite_compare:
        description: 'Manual diagnostic only: isolated owned Chrome, full registered suite, then isolated Chrome again on one Windows runner'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: portable-product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-chrome:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked compiler without running install scripts
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile product browser tests
        shell: pwsh
        run: npm run build
      - name: Verify signed Chrome moved to independent application path
        shell: pwsh
        env:
          UAH_TEST_CHROME_CPU_PRESSURE: ${{ github.event_name == 'workflow_dispatch' && inputs.chrome_cpu_pressure && 'true' || 'false' }}
          UAH_TEST_CHROME_BOOT_LOG: ${{ github.event_name == 'workflow_dispatch' && inputs.chrome_boot_log && 'true' || 'false' }}
          UAH_TEST_CHROME_FULL_SUITE_COMPARE: ${{ github.event_name == 'workflow_dispatch' && inputs.chrome_full_suite_compare && 'true' || 'false' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $candidates = @(
            (Join-Path $env:ProgramFiles 'Google\Chrome\Application'),
            (Join-Path ${env:ProgramFiles(x86)} 'Google\Chrome\Application')
          )
          $source = $null
          foreach ($candidate in $candidates) {
            if (Test-Path -LiteralPath (Join-Path $candidate 'chrome.exe')) {
              $source = $candidate
              break
            }
          }
          if (!$source) { throw 'Signed installed Chrome unavailable on this runner' }
          $sourceBinary = Join-Path $source 'chrome.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $sourceBinary
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Google LLC') {
            throw 'Installed source Chrome signature untrusted'
          }
          $root = Join-Path $env:RUNNER_TEMP ("uah-portable-product-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $root) { throw 'Refuse existing test directory' }
          New-Item -Path $root -ItemType Directory | Out-Null
          $copy = Join-Path $root 'IndependentChrome'
          New-Item -Path $copy -ItemType Directory | Out-Null
          & robocopy.exe $source $copy /E /XJ /R:1 /W:1 /NFL /NDL /NP
          if ($LASTEXITCODE -ge 8) { throw "Chrome runtime copy failed: $LASTEXITCODE" }
          $binary = Join-Path $copy 'chrome.exe'
          if (!(Test-Path -LiteralPath $binary)) { throw 'Independent Chrome binary absent' }
          $copiedSignature = Get-AuthenticodeSignature -LiteralPath $binary
          if ($copiedSignature.Status -ne 'Valid' -or $copiedSignature.SignerCertificate.Subject -notmatch 'CN=Google LLC') {
            throw 'Copied Chrome signature untrusted'
          }
          $env:UAH_TEST_PORTABLE_CHROME = $binary
          # Normal PR/push and ordinary manual runs remain one strict test suite.
          # Explicit manual CPU diagnostics compare baseline and controlled load
          # on the SAME ephemeral Windows runner and source SHA; no global CI
          # concurrency change, timeout increase or raw Chrome log publication.
          if ($env:UAH_TEST_CHROME_FULL_SUITE_COMPARE -eq 'true' -and
              $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            # This diagnostic answers a different question from the existing
            # two-worker stress experiment. Disable synthetic CPU pressure so
            # the only deliberate change is full registered suite workload.
            # Always record all THREE exits before failing the workflow. Raw
            # Chrome logs remain confined to the disposable native Profile.
            $env:UAH_TEST_CHROME_CPU_PRESSURE = 'false'
            $PSNativeCommandUseErrorActionPreference = $false
            Write-Output 'TASK005_FULLSUITE_ISOLATED_BEFORE_BEGIN'
            node --test --test-concurrency=1 dist/tests/browser/owned-chrome.test.js
            $beforeExit = $LASTEXITCODE
            Write-Output "TASK005_FULLSUITE_ISOLATED_BEFORE_EXIT=$beforeExit"
            Write-Output 'TASK005_FULLSUITE_REGISTERED_BEGIN'
            npm test
            $suiteExit = $LASTEXITCODE
            Write-Output "TASK005_FULLSUITE_REGISTERED_EXIT=$suiteExit"
            Write-Output 'TASK005_FULLSUITE_ISOLATED_AFTER_BEGIN'
            node --test --test-concurrency=1 dist/tests/browser/owned-chrome.test.js
            $afterExit = $LASTEXITCODE
            Write-Output "TASK005_FULLSUITE_ISOLATED_AFTER_EXIT=$afterExit"
            if ($beforeExit -ne 0 -or $suiteExit -ne 0 -or $afterExit -ne 0) {
              throw 'TASK-005 full-suite differential failed; preserve all phase outcomes'
            }
          } elseif ($env:UAH_TEST_CHROME_CPU_PRESSURE -eq 'true' -and
              $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $env:UAH_TEST_CHROME_CPU_PRESSURE = 'false'
            Write-Output 'TASK005_PAIRED_BASELINE_BEGIN'
            node --test --test-concurrency=1 dist/tests/browser/owned-chrome.test.js
            $baselineExit = $LASTEXITCODE
            Write-Output "TASK005_PAIRED_BASELINE_EXIT=$baselineExit"
            $env:UAH_TEST_CHROME_CPU_PRESSURE = 'true'
            Write-Output 'TASK005_PAIRED_PRESSURE_BEGIN'
            node --test --test-concurrency=1 dist/tests/browser/owned-chrome.test.js
            $pressureExit = $LASTEXITCODE
            Write-Output "TASK005_PAIRED_PRESSURE_EXIT=$pressureExit"
            if ($baselineExit -ne 0 -or $pressureExit -ne 0) {
              throw 'TASK-005 paired Chrome baseline/pressure validation failed; preserve both outcomes'
            }
          } else {
            node --test --test-concurrency=1 dist/tests/browser/owned-chrome.test.js
            if ($LASTEXITCODE -ne 0) { throw 'TASK-005 Chrome product validation failed' }
          }
