name: Documentation Integrity

on:
  push:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/scripts/verify-predevelopment.py'
      - '.github/workflows/docs-check.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/workflows/docs-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify document links, full traceability and staged admission
        shell: bash
        run: python3 .github/scripts/verify-predevelopment.py
      - name: Self-test admission verifier rejects broken references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import subprocess
          import tempfile
          with tempfile.TemporaryDirectory(prefix="predev-ci-selftest-") as tmp:
              root = Path(tmp)
              shutil.copytree("docs", root / "docs")
              shutil.copytree(".github/scripts", root / ".github/scripts")
              shutil.copy2("README.md", root / "README.md")
              shutil.copy2("AGENTS.md", root / "AGENTS.md")
              script = root / ".github/scripts/verify-predevelopment.py"
              matrix = root / "docs/10-traceability.md"
              content = matrix.read_text(encoding="utf-8")
              assert "| TASK-002 | TEST-001 |" in content
              matrix.write_text(content.replace("| TASK-002 | TEST-001 |", "| TASK-999 | TEST-001 |", 1), encoding="utf-8")
              broken = subprocess.run(["python3", str(script)], capture_output=True, text=True)
              if broken.returncode == 0 or "unknown task" not in broken.stderr:
                  raise SystemExit("Validator failed to reject a nonexistent task reference")
              matrix.write_text(content, encoding="utf-8")
              (root / "docs/13-predevelopment-admission.md").rename(root / "docs/13-predevelopment-admission.md.absent")
              missing = subprocess.run(["python3", str(script)], capture_output=True, text=True)
              if missing.returncode == 0 or "Missing required authority" not in missing.stderr:
                  raise SystemExit("Validator failed to reject a missing admission document")
          print("PASS: checker rejects invalid task refs and missing authority doc in isolated temporary copies")
          PY
      - name: Verify required documents and record numbering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          docnames = ("intake","product","requirements","feasibility","architecture","experience","security-risk","testing","release","development-plan","traceability","readiness","handoff")
          required = [Path(f"docs/{i:02d}-{n}.md") for i,n in enumerate(docnames)]
          required += [Path("README.md"), Path("AGENTS.md")]
          required += [Path(f"docs/adr/ADR-{i:03d}-{n}.md") for i,n in ((1,"application-baseline"),(2,"real-userscript-acceptance"),(3,"windows-dual-package"))]
          for path in required:
              if not path.exists():
                  raise SystemExit(f"Missing file: {path}")
              if not path.read_text(encoding="utf-8").startswith("# "):
                  raise SystemExit(f"Invalid Markdown heading: {path}")
          checks = (
              ("docs/02-requirements.md", "REQ", 28),
              ("docs/02-requirements.md", "NFR", 12),
              ("docs/06-security-risk.md", "RISK", 13),
              ("docs/07-testing.md", "TEST", 28),
              ("docs/08-release.md", "GATE", 11),
              ("docs/09-development-plan.md", "TASK", 21),
          )
          for filename, prefix, n in checks:
              found = set(re.findall(r"\b"+prefix+r"-(\d{3})\b", Path(filename).read_text(encoding="utf-8")))
              expected = {f"{i:03d}" for i in range(1,n+1)}
              if not expected.issubset(found):
                  raise SystemExit(f"{filename} missing {prefix}: {sorted(expected - found)}")
          # Verify the authoritative record table itself is complete, ordered and
          # has a fixed number of fields; incidental citations elsewhere do not count.
          widths = {"REQ":14, "NFR":8, "RISK":10, "TEST":11, "GATE":8, "TASK":12}
          for filename, prefix, n in checks:
              rows = [line for line in Path(filename).read_text(encoding="utf-8").splitlines()
                      if line.startswith(f"| {prefix}-")]
              ids = []
              for line in rows:
                  match = re.match(r"\| "+prefix+r"-(\d{3}) \|", line)
                  if not match:
                      raise SystemExit(f"Bad record prefix in {filename}: {line[:80]}")
                  ids.append(int(match.group(1)))
                  actual_width = len(line.split("|")) - 2
                  if actual_width != widths[prefix]:
                      raise SystemExit(f"{prefix}-{match.group(1)} has {actual_width} columns, expected {widths[prefix]}")
                  if prefix == "TEST":
                      fields = [field.strip() for field in line.strip("|").split("|")]
                      if fields[1] != f"REQ-{match.group(1)}":
                          raise SystemExit(f"Broken TEST->REQ mapping in {filename}: {fields[:2]}")
              if ids != list(range(1, n+1)):
                  raise SystemExit(f"{prefix} rows must be consecutive and unique: {ids}")
          print("Documentation structure, fields, one-to-one tests and numbering checks passed.")
          PY
