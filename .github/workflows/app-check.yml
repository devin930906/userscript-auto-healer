name: Application Skeleton Checks

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/app-check.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/app-check.yml'
  workflow_dispatch:
    inputs:
      ast_worker_diagnostic:
        description: 'Add bounded TASK-013 Worker diagnosis to full checks'
        type: boolean
        required: false
        default: false
      chrome_startup_diagnostic:
        description: 'Run bounded isolated Chrome CDP startup samples (TASK-008)'
        type: boolean
        required: false
        default: false
      chrome_cpu_pressure:
        description: 'Opt in to synthetic CPU pressure for Chrome startup samples only'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # Isolate optional diagnostic runs from required push/PR checks on the same ref.
  group: app-check-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.ast_worker_diagnostic && '-worker-diagnostic' || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.chrome_startup_diagnostic && '-chrome-diagnostic' || '' }}
  cancel-in-progress: true

jobs:
  boundary:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked toolchain for compile-time checks
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type check
        shell: pwsh
        run: npm run typecheck
      - name: Security and configuration regression tests
        shell: pwsh
        run: npm test

  windows-shell-smoke:
    needs: boundary
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked Electron runtime
        shell: pwsh
        run: npm ci --no-audit --no-fund
      - name: Download pinned Electron runtime on demand
        shell: pwsh
        run: |
          # GitHub's Electron release endpoint may return a transient 502/503/504.
          # Bound retries to these gateway failures; never hide any other error
          # or change the pinned Electron version or smoke acceptance criteria.
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            $downloadOutput = (& npx --no-install install-electron --no 2>&1 | Out-String)
            $exitCode = $LASTEXITCODE
            if ($downloadOutput) { Write-Output $downloadOutput.TrimEnd() }
            if ($exitCode -eq 0) { break }
            if ($downloadOutput -notmatch 'HTTPError:\s+Response code (?:502|503|504)\b' -or
                $attempt -eq $maxAttempts) {
              throw "Pinned Electron download failed (attempt $attempt/$maxAttempts, exit $exitCode)"
            }
            Write-Warning "Transient Electron release gateway error; retrying attempt $($attempt + 1)/$maxAttempts"
            Start-Sleep -Seconds (5 * $attempt)
          }
      - name: Compile desktop application
        shell: pwsh
        run: npm run build
      - name: Test actual isolated renderer and preload IPC
        shell: pwsh
        run: |
          $binary = Join-Path $PWD 'node_modules/electron/dist/electron.exe'
          if (!(Test-Path $binary)) { throw 'Electron executable missing' }
          $env:UAH_SMOKE_RECEIPT = Join-Path $PWD 'electron-shell-smoke.json'
          $process = Start-Process -FilePath $binary -ArgumentList @('.', '--uahtest-shell-only') -WorkingDirectory $PWD -PassThru
          try {
            # Wait on the original process handle. A separate PID-based wait or
            # Stop-Process could target an unrelated process after PID reuse.
            if (-not $process.WaitForExit(60000)) {
              if (-not $process.HasExited) {
                # Kill only the exact process instance started by this test.
                $process.Kill()
                [void]$process.WaitForExit(5000)
              }
              throw 'Electron smoke process timed out'
            }
            $process.Refresh()
            if ($process.ExitCode -ne 0) {
              # The smoke writes only a narrow, allowlisted error code to this
              # disposable receipt; never print arbitrary exception text.
              $failureReceipt = $env:UAH_SMOKE_RECEIPT + '.failure'
              if (Test-Path -LiteralPath $failureReceipt -PathType Leaf) {
                $failureCode = [IO.File]::ReadAllText($failureReceipt).Trim()
                if ($failureCode -match '^[A-Z][A-Z0-9_]{4,90}$') {
                  Write-Output "Electron smoke failure: $failureCode"
                }
              }
              throw "Electron exited with code $($process.ExitCode)"
            }
          } finally {
            # Keep candidate and regular Electron smoke handle lifetimes aligned.
            $process.Dispose()
          }
          if (!(Test-Path $env:UAH_SMOKE_RECEIPT)) { throw 'Real renderer receipt missing' }
          $result = Get-Content -Raw $env:UAH_SMOKE_RECEIPT | ConvertFrom-Json
          if ($result.shell -ne 'development-skeleton' -or !$result.preloadIpcVerified -or !$result.rendererSandboxVerified -or $result.automaticRepairAvailable) {
            throw 'Electron runtime safety receipt invalid'
          }
          Write-Output 'PASS: Actual Electron sandbox renderer + allowlisted preload IPC'

  ast-worker-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ast_worker_diagnostic }}
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked compile-time toolchain
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile test fixtures
        shell: pwsh
        run: npm run build
      - name: Diagnose intermittent isolated AST Worker (TASK-013, issue 440)
        shell: pwsh
        run: |
          Write-Output "Source SHA: $env:GITHUB_SHA"
          node --version
          # 120 seconds bounds starting/completing samples between checks. A
          # stalled child is bounded by the job's separate eight-minute limit.
          $budget = [Diagnostics.Stopwatch]::StartNew()
          for ($attempt = 1; $attempt -le 10; $attempt++) {
            if ($budget.Elapsed.TotalSeconds -ge 120) {
              throw 'Diagnostic budget exhausted before all 10 samples; no reliability conclusion.'
            }
            Write-Output "Worker diagnostic sample $attempt/10"
            $sample = [Diagnostics.Stopwatch]::StartNew()
            node --test --test-concurrency=1 dist/tests/analyze/import-preview.test.js
            $testExitCode = $LASTEXITCODE
            $sample.Stop()
            Write-Output "Sample $attempt exit=$testExitCode elapsed_ms=$($sample.ElapsedMilliseconds)"
            if ($testExitCode -ne 0) {
              throw 'Worker diagnostic failed; preserve preceding reason codes and test output.'
            }
            # The full suite intentionally emits bounded failure markers in its
            # mocked retirement-failure tests. Run real isolated Worker
            # scenarios separately so unexpected lifecycle markers here are
            # not confused with deliberate fault-injection evidence. Keep the
            # full suite above; this is additional coverage, not a replacement.
            # Match the 24-, 36- and 70-file real Worker scenarios only.
            $realWorkerPattern = 'native-batch AST results run in an actual isolated Node worker|native batch previews 36 scripts across bounded isolated worker segments|read-only native AST batch continues beyond 64 files'
            node --test --test-concurrency=1 --test-name-pattern="$realWorkerPattern" dist/tests/analyze/import-preview.test.js
            $realExitCode = $LASTEXITCODE
            Write-Output "Real Worker sample $attempt exit=$realExitCode"
            if ($realExitCode -ne 0) {
              throw 'Real isolated Worker sample failed; preserve bounded lifecycle diagnostics.'
            }
            if ($budget.Elapsed.TotalSeconds -ge 120) {
              throw 'Diagnostic budget exhausted; no reliability conclusion.'
            }
          }
          # ISSUE-440 / TEST-004/011/022: the original flaky Windows test
          # ran amid other Node test processes; serial samples alone do not
          # exercise competing Worker startup and retirement. Run only the
          # existing synthetic 24/36/70-file fixtures in three independent
          # Node processes concurrently. No user scripts or privileges are used.
          Write-Output 'Concurrent genuine Worker fixture probe: 3 bounded processes'
          $probeJobs = @()
          try {
            for ($probe = 1; $probe -le 3; $probe++) {
              $probeJobs += Start-Job -ArgumentList @($PWD.Path, $realWorkerPattern) -ScriptBlock {
                param([string]$workingDirectory, [string]$pattern)
                Set-Location -LiteralPath $workingDirectory
                & node --test --test-concurrency=1 "--test-name-pattern=$pattern" dist/tests/analyze/import-preview.test.js
                if ($LASTEXITCODE -ne 0) { throw 'Isolated Worker fixture failed under process contention' }
              }
            }
            foreach ($probeJob in $probeJobs) {
              if (-not (Wait-Job -Job $probeJob -Timeout 25)) {
                throw 'Concurrent Worker probe exceeded its bounded 25-second wait'
              }
              # Preserve the actual test output on failure instead of
              # considering a completed PowerShell job sufficient evidence.
              # Preserve bounded synthetic-fixture TAP output (including any
              # Worker lifecycle reason) for a real intermittent failure.
              # Discarding it would hide the concurrent probe's diagnostic
              # evidence even when a job reports a completed state.
              Receive-Job -Job $probeJob -ErrorAction Stop | Out-Host
              if ($probeJob.State -ne 'Completed') {
                throw 'Concurrent Worker probe did not complete successfully'
              }
            }
          } finally {
            foreach ($probeJob in $probeJobs) {
              if ($probeJob.State -notin @('Completed', 'Failed', 'Stopped')) {
                Stop-Job -Job $probeJob -ErrorAction SilentlyContinue
              }
              Remove-Job -Job $probeJob -Force -ErrorAction SilentlyContinue
            }
          }
          if ($budget.Elapsed.TotalSeconds -ge 120) {
            throw 'Diagnostic budget exhausted after concurrent fixture probe; no reliability conclusion.'
          }
          $budget.Stop()
          Write-Output "Ten serial samples and three concurrent Worker probes passed in $($budget.ElapsedMilliseconds) ms; intermittent reliability remains unproven."

  chrome-startup-diagnostic:
    # No browser-authorization or acceptance criteria are changed by this job.
    # It uses existing real Chrome tests with their original 20s CDP deadline,
    # clean disposable profiles and fail-closed ownership checks.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.chrome_startup_diagnostic }}
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked compile-time toolchain
        shell: pwsh
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile existing isolated Chrome test fixture
        shell: pwsh
        run: npm run build
      - name: Observe bounded Chrome CDP startup (TASK-008, not product acceptance)
        shell: pwsh
        env:
          UAH_TEST_CHROME_BOOT_LOG: 'true'
          UAH_TEST_CHROME_CPU_PRESSURE: ${{ inputs.chrome_cpu_pressure && 'true' || 'false' }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Each Node invocation owns a new disposable profile and browser.
          # On the first failure stop and keep only the existing redacted
          # stage/marker/listener diagnostics in Actions logs. Chrome raw
          # diagnostic files stay in RUNNER_TEMP and are never uploaded.
          for ($sample = 1; $sample -le 3; $sample++) {
            Write-Output "Bounded isolated Chrome startup sample $sample/3"
            node --test --test-concurrency=1 "--test-name-pattern=TEST-006/008/009: isolated signed Chrome presents owned CDP HTTP only" dist/tests/browser/owned-chrome.test.js
            if ($LASTEXITCODE -ne 0) {
              throw 'Isolated Chrome startup sample failed; preserve original redacted test diagnostics.'
            }
          }
          Write-Output 'Three bounded isolated Chrome startup samples passed; intermittent reliability remains unproven.'
