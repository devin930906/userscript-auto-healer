name: TASK-007 Official Tampermonkey isolated Windows experiment (NOT STABLE)

on:
  pull_request:
    paths:
      - 'poc/windows-tampermonkey-cloud.cjs'
      - 'poc/crx3-package-integrity.cjs'
      - 'poc/crx3-package-integrity.test.cjs'
      - 'src/manager/tampermonkey-gm-probe.ts'
      - '.github/workflows/task007-tampermonkey-cloud.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task007-tampermonkey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Download and verify the vendor package ONCE. Without this gate each of
  # the 14 independent Windows runners would repeat a failing network call.
  # A failed upstream source download never starts any manager/profile job.
  approved-package:
    name: Acquire signed Tampermonkey CRX once (NOT store attestation)
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Get vendor or official Chrome Web Store update package and verify signing key
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $base = Join-Path $env:RUNNER_TEMP 'uah-tm-source'
          if (Test-Path -LiteralPath $base) { throw 'Unexpected preexisting isolated source directory' }
          New-Item -ItemType Directory -Path $base | Out-Null
          $crx = Join-Path $base 'tampermonkey_stable.crx'
          try {
            Invoke-WebRequest -Uri 'https://www.tampermonkey.net/crx/tampermonkey_stable.crx' -OutFile $crx -MaximumRedirection 3 -TimeoutSec 60
            Write-Host 'CRX origin: Tampermonkey vendor official package'
          } catch {
            # Google/Chromium documents clients2.google.com as the official
            # Chrome Web Store update endpoint. Do not use third-party mirrors,
            # disable certificate validation or accept a mismatched signing key.
            Write-Warning 'Vendor download unavailable: trying official Chrome Web Store update endpoint'
            Remove-Item -LiteralPath $crx -Force -ErrorAction SilentlyContinue
            $store = 'https://clients2.google.com/service/update2/crx?response=redirect&prodversion=155.0.0.0&acceptformat=crx3&x=id%3Ddhdgffkkebhmkfjojejmpbldmpobfkfo%26uc'
            Invoke-WebRequest -Uri $store -OutFile $crx -MaximumRedirection 5 -TimeoutSec 90
            Write-Host 'CRX origin: official Chrome Web Store update service'
          }
          node --test ./poc/crx3-package-integrity.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'CRX3 signature parser regressions failed' }
          $verifiedZip = Join-Path $base 'verified.zip'
          node ./poc/crx3-package-integrity.cjs $crx $verifiedZip
          if ($LASTEXITCODE -ne 0) { throw 'Source CRX3 signature/key binding verification failed' }
          Write-Host ("Verified source CRX SHA256: " + (Get-FileHash -LiteralPath $crx -Algorithm SHA256).Hash)
      - name: Upload isolated signed source for same-run manager matrix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uah-tampermonkey-signed-crx
          path: ${{ runner.temp }}/uah-tm-source/tampermonkey_stable.crx
          if-no-files-found: error
          retention-days: 1

  actual-tampermonkey:
    needs: approved-package
    name: Tampermonkey ${{ matrix.run_at }} / ${{ matrix.variant }}
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      # Each independent profile proves a distinct @run-at mode, not a
      # synthetic declaration check. Limit simultaneous Windows runners.
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - run_at: document-start
            variant: baseline
          - run_at: document-body
            variant: baseline
          - run_at: document-end
            variant: baseline
          - run_at: document-idle
            variant: baseline
          # Real application AST planner creates a review-only candidate.
          # Two independent managers assert the stale original does not work
          # and the exact audited candidate restores a disposable fixture.
          - run_at: document-idle
            variant: product-original
          - run_at: document-idle
            variant: product-candidate
          # TASK-007 / TEST-017/018: Unlike the native GM-only fixture,
          # these two jobs run actual application-generated AST original and
          # audited candidate under document-start in separate disposable
          # manager Profiles, checking failed selector vs restored DOM action.
          # Only review evidence is produced; no script is auto-installed
          # into user Chrome and no repair/rollback permissions are granted.
          - run_at: document-start
            variant: product-original
          - run_at: document-start
            variant: product-candidate
          # TASK-007/009/012 / TEST-017/018/019/023: validate the newly
          # integrated getElementById ID-to-ID review-only candidate inside
          # actual vendor-hosted Tampermonkey. Independent Profiles install
          # native exported original vs verified candidate; candidate Profile
          # also explicitly reinstalls the independent recovery export.
          - run_at: document-idle
            variant: product-id-original
          - run_at: document-idle
            variant: product-id-candidate
          # End-to-end manager installation of the actual native product fixture.
          # Unlike the AST-only PoC, this is the source served by production code.
          # Native product-generated GM diagnostic in every supported timing
          # mode; unlike baseline, these use production fixture generation.
          # Every entry has its own disposable Profile and manager install.
          - run_at: document-start
            variant: native-gm
          - run_at: document-body
            variant: native-gm
          - run_at: document-end
            variant: native-gm
          - run_at: document-idle
            variant: native-gm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Obtain signed source from same-run verified source job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: uah-tampermonkey-signed-crx
          path: ${{ runner.temp }}/uah-tampermonkey-source
      - name: Reverify pinned signing key and validate disposable extraction boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $base = Join-Path $env:RUNNER_TEMP "uah-tampermonkey-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $base) { throw 'Disposable directory already exists' }
          New-Item -ItemType Directory -Path $base | Out-Null
          $crx = Join-Path $base 'tampermonkey_stable.crx'
          $zip = Join-Path $base 'tampermonkey.zip'
          $extension = Join-Path $base 'extension'
          # Artifact transport does not grant extension authenticity: copy only
          # the fixed-name CRX from our upstream job and revalidate its
          # pinned developer key and bounded ZIP bytes in EACH fresh profile.
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'uah-tampermonkey-source/tampermonkey_stable.crx') -Destination $crx -ErrorAction Stop
          # TEST-017/026: the CRX3 magic/header length alone does NOT
          # authenticate ZIP bytes. Verify a developer-key proof over the
          # exact signed header and archive before writing any ZIP for unzip.
          # This still cannot attest Chrome Web Store publication/signature.
          node --test ./poc/crx3-package-integrity.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'CRX3 signature verifier regressions failed' }
          node ./poc/crx3-package-integrity.cjs $crx $zip
          if ($LASTEXITCODE -ne 0) { throw 'CRX3 signing key or ZIP integrity not verified' }
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            if ($archive.Entries.Count -lt 10 -or $archive.Entries.Count -gt 10000) { throw 'Invalid CRX entry count' }
            $total = [long]0
            foreach ($entry in $archive.Entries) {
              $name = $entry.FullName
              if ($name.StartsWith('/') -or $name.Contains('\') -or
                  $name -match '(^|/)\.\.(/|$)' -or $name.Contains(':')) {
                throw 'Unsafe extension archive path'
              }
              $total += $entry.Length
              if ($total -gt 134217728) { throw 'Extension extraction byte limit exceeded' }
            }
          } finally { $archive.Dispose() }
          Expand-Archive -LiteralPath $zip -DestinationPath $extension -Force
          $manifestFile = Join-Path $extension 'manifest.json'
          if (!(Test-Path -LiteralPath $manifestFile)) { throw 'Missing root manifest' }
          $manifest = Get-Content -LiteralPath $manifestFile -Raw | ConvertFrom-Json
          if ($manifest.manifest_version -ne 3) { throw 'Expected official MV3 package' }
          Write-Host ("Official-hosted CRX SHA256: " + (Get-FileHash -LiteralPath $crx -Algorithm SHA256).Hash)
          Write-Host ("MV3 manifest version: " + $manifest.version)
          "UAH_TM_EXTENSION_DIR=$extension" >> $env:GITHUB_ENV
          "UAH_TM_PROFILE_DIR=$(Join-Path $base 'profile')" >> $env:GITHUB_ENV
          "UAH_TM_TOOLING_DIR=$(Join-Path $base 'tooling')" >> $env:GITHUB_ENV
      - name: Install isolated pinned browser testing tooling
        shell: pwsh
        run: |
          npm install --prefix $env:UAH_TM_TOOLING_DIR --no-audit --no-fund --ignore-scripts playwright@1.56.0
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Playwright toolchain install failed' }
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:UAH_TM_TOOLING_DIR 'browsers'
          & (Join-Path $env:UAH_TM_TOOLING_DIR 'node_modules\.bin\playwright.cmd') install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Disposable Chromium download failed' }
          "PLAYWRIGHT_BROWSERS_PATH=$env:PLAYWRIGHT_BROWSERS_PATH" >> $env:GITHUB_ENV
      - name: Build native product AST planner for product candidate cases
        if: matrix.variant != 'baseline'
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Locked application dependency installation failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Native product AST planner build failed' }
      - name: Execute real extension manager + GM API + synthetic business assertions
        shell: pwsh
        env:
          UAH_TM_RUN_AT: ${{ matrix.run_at }}
          UAH_TM_VARIANT: ${{ matrix.variant }}
        run: |
          $env:NODE_PATH = Join-Path $env:UAH_TM_TOOLING_DIR 'node_modules'
          node ./poc/windows-tampermonkey-cloud.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Official Tampermonkey experimental verification incomplete; TEST-017/018 still blocked' }
