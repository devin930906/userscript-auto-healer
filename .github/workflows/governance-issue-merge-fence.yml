name: 'Issue Coordination PR Fence'

# Run ONLY the default-branch workflow; never execute or trust a PR-edited
# workflow or script. No PR code is checked out or run.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions: {}

jobs:
  fence:
    name: Issue coordination / stale round fence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout trusted base commit only (never PR HEAD)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Validate exact PR against current coordinator state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -m py_compile .github/scripts/issue-merge-fence.py
          python3 .github/scripts/issue-merge-fence.py --self-test
          python3 .github/scripts/issue-merge-fence.py
