name: Windows Candidate EXE and ZIP (NOT STABLE)

on:
  pull_request:
    paths:
      - 'scripts/windows-package-candidate.ps1'
      - 'scripts/windows-portable-relocation.ps1'
      - 'scripts/test-windows-portable-relocation.ps1'
      - 'tests/**'
      - '.github/workflows/windows-candidate-packages.yml'
      - 'app/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-windows-packaging:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked development toolchain and Electron runtime
        shell: pwsh
        run: npm ci --no-audit --no-fund
      - name: Verify type contracts
        shell: pwsh
        run: npm run typecheck
      # Verify the independent Windows filesystem gate first so a separate
      # Chrome/CDP startup problem cannot hide a candidate relocation defect.
      # Both checks are still mandatory; neither failure is ignored.
      - name: Test real Windows portable relocation, file locks and no overwrite
        shell: pwsh
        run: ./scripts/test-windows-portable-relocation.ps1
      - name: Run registered regressions and compile the real app
        shell: pwsh
        run: npm test
      - name: Package Windows deliverables and verify candidates
        id: package
        shell: pwsh
        run: |
          npx --no-install install-electron --no
          if ($LASTEXITCODE -ne 0) { throw 'Electron runtime installation failed' }
          ./scripts/windows-package-candidate.ps1
      - name: Upload unapproved candidate files (never a GitHub Release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: userscript-auto-healer-windows-CANDIDATE
          path: ${{ steps.package.outputs.candidate_directory }}/*
          if-no-files-found: error
          retention-days: 3
