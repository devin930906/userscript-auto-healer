name: Official RAR trial archive feasibility

# This evaluates a time-limited third-party trial. Never run on every push.
on:
  workflow_dispatch:
    inputs:
      trial_eligible:
        description: 'I confirm any evaluation complies with the vendor trial terms'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  rar-evaluation:
    if: inputs.trial_eligible == true
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate authentic RAR format in temporary licensed trial scope
        shell: pwsh
        run: ./poc/windows-rar-evaluation.ps1
