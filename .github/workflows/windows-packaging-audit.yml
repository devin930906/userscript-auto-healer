name: Windows installer and ZIP archive feasibility

on:
  push:
    paths:
      - 'poc/windows-packaging-audit.ps1'
      - '.github/workflows/windows-packaging-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling-audit:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise isolated EXE installer and native ZIP round trip
        shell: pwsh
        run: ./poc/windows-packaging-audit.ps1
