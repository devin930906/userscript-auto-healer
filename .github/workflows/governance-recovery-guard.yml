name: 'Governance #565 Bootstrap Recovery Guard (READ ONLY)'

on:
  pull_request:
    branches: [main]
    paths:
  # Historical bootstrap only; do not run on every later AGENTS/docs edit.
      - '.github/scripts/verify-governance-recovery.py'
      - '.github/workflows/governance-recovery-guard.yml'

permissions: {}

jobs:
  validate:
    # This was an exact one-time bootstrap branch, not a general-purpose CI gate.
    if: github.head_ref == 'repair/governance-565-bootstrap-20261101'
    name: Owner-authorized historical bootstrap scope (NOT PRODUCTION FENCE)
    if: github.event.pull_request.head.repo.full_name == 'devin930906/userscript-auto-healer'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python syntax and adversarial local checks
        run: |
          python3 -m py_compile .github/scripts/verify-governance-recovery.py
          python3 .github/scripts/verify-governance-recovery.py --self-test
      - name: Verify exact PR, unchanged historical refs and exclusive PR review window
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_PR_NUMBER: ${{ github.event.pull_request.number }}
          RECOVERY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/verify-governance-recovery.py
